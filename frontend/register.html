<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kayıt Ol — Budgy</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/api.js"></script>
    <script src="js/guard.js"></script>
  </head>
  <body>
    <div class="page">
      <h1 class="gradient-text">Hesap oluştur</h1>
      <p class="subtitle">Bir dakikadan az sürer.</p>

      <div class="card">
        <form id="register-form">
          <label for="email">E-posta</label>
          <input id="email" type="email" required autocomplete="email" />

          <label for="username">Kullanıcı Adı</label>
          <input id="username" type="text" required minlength="2" maxlength="50" autocomplete="username" placeholder="örn. faruk" />

          <label for="password">Şifre</label>
          <input id="password" type="password" required minlength="8" autocomplete="new-password" />

          <button class="full" type="submit">Kayıt Ol</button>
          <p class="error" id="error"></p>
        </form>
      </div>

      <p class="hint">Zaten hesabın var mı? <a href="login.html">Giriş yap</a></p>
    </div>

    <script>
      redirectIfAuthed();

      const form = document.getElementById("register-form");
      const errorEl = document.getElementById("error");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorEl.textContent = "";
        const email = document.getElementById("email").value.trim();
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        try {
          const { access_token } = await api.register(email, username, password);
          setToken(access_token);
          window.location.href = "dashboard.html";
        } catch (err) {
          errorEl.textContent = err.message;
        }
      });
    </script>
  </body>
</html>
